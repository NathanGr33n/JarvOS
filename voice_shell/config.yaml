audio:
  input_device: null
  output_device: null
  sample_rate_input: 16000
  sample_rate_output: 22050
  chunk_size: 512
  max_recording_duration: 30
wake_word:
  engine: "hotkey"
  model_path: null
  keyword: "Hey Nova"
  sensitivity: 0.5
stt:
  engine: "whisper.cpp"
  base_url: "http://127.0.0.1:8081"
  language: "en"
  translate: false
llm:
  engine: "llama.cpp"
  base_url: "http://127.0.0.1:8082"
  max_tokens: 512
  temperature: 0.7
  system_prompt: null
tts:
  engine: "piper"
  model_path: "models/piper/en_US-lessac-medium.onnx"
  speaker_id: 0
  binary_path: "piper"
actions:
  allowed_shell_commands: ["ls", "cat", "pwd", "date", "cd", "time", "list_directory", "read_file", "search_files", "get_battery_status"]
  allowed_apps: ["firefox", "nautilus", "code", "terminal"]
  require_confirmation: false
hud:
  enabled: true
  show_timestamps: true
  mode: "both"
  width: 480
  height: 140
  anchor: "top-center"
  margin: 24
  opacity: 0.92
memory:
  enabled: true
  db_path: "data/memory.db"
  history_limit: 3
services:
  # Prefer systemd user units in real sessions. Enable these only for dev supervision.
  manage_whisper: false
  manage_llama: false
  autostart: false
  ready_timeout: 30
  whisper_command: []
  llama_command: []
  whisper_health_url: null
  llama_health_url: null
