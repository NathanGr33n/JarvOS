name: Daily Contribution

on:
  schedule:
    - cron: "15 2 * * *" # Runs daily at 02:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-contribution
  cancel-in-progress: false

jobs:
  commit-daily-change:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Update activity file
        run: |
          mkdir -p .github/activity
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/activity/last-run.txt

      - name: Commit and push if changed
        run: |
          git config user.name "NathanGr33n"
          git config user.email "NathanGr33n@users.noreply.github.com"
          git add .github/activity/last-run.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily activity update"
          git push origin HEAD
