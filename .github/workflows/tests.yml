name: Tests

on:
  pull_request:
  push:
    branches: [Master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      JARVOS_HUD_HEADLESS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: voice_shell/requirements-test.txt
      - name: Install headless test dependencies
        run: python -m pip install -r voice_shell/requirements-test.txt
      - name: Check Python syntax
        run: python -m compileall -q voice_shell
      - name: Run tests
        run: python -m pytest -q
